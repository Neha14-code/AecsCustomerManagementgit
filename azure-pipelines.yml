trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
- name: buildConfiguration
  value: 'Release'

stages:

# =========================
# STAGE 1 - BUILD
# =========================
- stage: Build
  displayName: "Build and Publish"

  jobs:
  - job: BuildJob
    displayName: "Build ASP.NET Core Application"

    steps:
    - task: DotNetCoreCLI@2
      displayName: "Restore"
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: "Build"
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: "Publish"
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: "Publish Artifact"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'drop'
        publishLocation: 'pipeline'


# =========================
# STAGE 2 - STAGING QA
# =========================
- stage: Deploy_QA
  displayName: "Deploy to Staging-QA"
  dependsOn:
    - Build
  condition: succeeded()

  jobs:
  - deployment: DeployToQA
    displayName: "Deploy to Staging-QA"
    environment:
      name: 'staging-qa'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadPipelineArtifact@2
            displayName: "Download Build Artifact"
            inputs:
              buildType: 'current'
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'

          - task: AzureWebApp@1
            displayName: "Deploy App to Staging-QA"
            inputs:
              azureSubscription: 'logic-house-connection'
              appType: 'webApp'
              appName: 'aecslogichouseapp'
              deployToSlotOrASE: true
              resourceGroupName: 'visualstudioonline-edb5134c6cba491eaa4026a0a57c5bda'
              slotName: 'staging-qa'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'


# =========================
# STAGE 3 - PRODUCTION
# =========================
- stage: Swap_Production
  displayName: "Swap Staging-QA to Production"

  dependsOn:
    - Deploy_QA
  condition: succeeded()

  jobs:
  - deployment: SwapToProduction
    displayName: "Swap Staging-QA to Production"

    environment:
      name: 'production'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureAppServiceManage@0
            displayName: "Swap Staging-QA with Production"
            inputs:
              azureSubscription: 'logic-house-connection'
              Action: 'Swap Slots'
              WebAppName: 'aecslogichouseapp'
              ResourceGroupName: 'visualstudioonline-edb5134c6cba491eaa4026a0a57c5bda'
              SourceSlot: 'staging-qa'
              SwapWithProduction: true